name: Build + deploy docs

on:
  push:
    branches: [main, vendor-abstraction-phase-a]
    paths:
      - 'docs/site/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - name: Install MkDocs
        run: pip install -r docs-requirements.txt

      - name: Build site
        run: mkdocs build --strict --clean

      - name: Deploy to GitHub Pages (mirror repo only)
        if: github.repository == 'eduardd76/dream_team_public'
        run: |
          mkdocs gh-deploy --force --no-history
